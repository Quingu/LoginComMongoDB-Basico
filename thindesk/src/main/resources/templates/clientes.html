<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes — ThinDesk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
  <link rel="stylesheet" th:href="@{/css/principal.css}">
</head>
<body>
<div th:replace="~{fragmentos/cabecalho :: cabecalho}"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-3 col-lg-2 p-0"><div th:replace="~{fragmentos/menu :: menu}"></div></div>
    <main class="col-md-9 col-lg-10 conteudo" th:fragment="content">
      <h2>Clientes</h2>
      <div class="cartao table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr><th>Nome</th><th>Telefone</th><th>Setor</th><th>Ações</th></tr>
          </thead>
          <tbody>
            <tr th:each="cliente : ${clientes}">
              <td th:text="${cliente.nome}"></td>
              <td th:text="${cliente.telefone}"></td>
              <td th:text="${cliente.setor}"></td>
              <td class="text-nowrap">
                <a th:href="@{'/clientes/novo/'}" class="btn btn-primario btn-sm">Novo</a>
                <a th:href="@{'/clientes/editar/' + ${cliente.id}}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{'/clientes/deletar/' + ${cliente.id}}" class="btn btn-danger btn-sm">Excluir</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="4" class="text-center">Nenhum cliente cadastrado.</td></tr>
          </tbody>
        </table>
      </div>
      <div th:replace="~{fragmentos/rodape :: rodape}"></div>
    </main>
  </div>
</div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
