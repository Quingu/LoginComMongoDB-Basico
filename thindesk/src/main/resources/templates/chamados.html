<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chamados — ThinDesk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
  <link rel="stylesheet" th:href="@{/css/principal.css}">
</head>
<body>
<div th:replace="~{fragmentos/cabecalho :: cabecalho}"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-3 col-lg-2 p-0"><div th:replace="~{fragmentos/menu :: menu}"></div></div>
    <main class="col-md-9 col-lg-10 conteudo" th:fragment="content">
      <h2>Chamados</h2>
      <div class="cartao table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr><th>Descrição</th><th>Status</th><th>Tipo</th><th>Técnico</th><th>Usuário</th><th></th></tr>
          </thead>
          <tbody>
            <th:block th:each="chamado : ${chamados}">
              <tr>
                <td th:text="${chamado?.descricao}"></td>
                <td><span class="badge bg-secondary" th:text="${chamado?.status}"></span></td>
                <td th:text="${chamado?.tipo}"></td>
                <td th:text="${chamado?.tecnico}"></td>
                <td th:text="${chamado?.usuario}"></td>
                <td class="text-nowrap">
                  <a th:href="@{'/chamados/novo/'}" class="btn btn-primario btn-sm">Novo</a>
                  <a th:href="@{'/chamados/atualizar/' + ${chamado.id}}" class="btn btn-warning btn-sm">Editar</a>
                  <a th:href="@{'/chamados/cancelar/' + ${chamado.id}}" class="btn btn-danger btn-sm">Cancelar</a>
                </td>
              </tr>
            </th:block>
            <tr th:if="${#lists.isEmpty(chamados)}"><td colspan="6" class="text-center">Nenhum chamado aberto.</td></tr>
          </tbody>
        </table>
      </div>
      <div th:replace="~{fragmentos/rodape :: rodape}"></div>
    </main>
  </div>
</div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
