<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração — ThinDesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
  <link rel="stylesheet" th:href="@{/css/principal.css}">
  <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body>
<div th:replace="~{fragmentos/cabecalho :: cabecalho}"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-3 col-lg-2 p-0"><div th:replace="~{fragmentos/menu :: menu}"></div></div>
    <main class="col-md-9 col-lg-10 conteudo">
      <h2>Painel do Administrador</h2>
      <p style="color:var(--cor-texto-fraco)">Gerencie usuários e perfis de acesso.</p>
      <div class="cartao table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ativo</th><th></th></tr></thead>
          <tbody>
            <tr th:each="u : ${usuarios}">
              <td th:text="${u.nome}"></td>
              <td th:text="${u.email}"></td>
              <td><span class="badge bg-secondary" th:text="${u.perfil}"></span></td>
              <td th:text="${u.ativo} ? 'Sim' : 'Não'"></td>
              <td>
                <form th:action="@{/administrador/promover/{id}(id=${u.id})}" method="post" class="d-flex gap-1">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <select name="perfil" class="form-select form-select-sm" style="max-width:170px">
                    <option value="USUARIO">USUARIO</option>
                    <option value="GERENTE">GERENTE</option>
                    <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                  </select>
                  <button class="btn btn-primario btn-sm" type="submit">Aplicar</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5" class="text-center">Nenhum usuário cadastrado.</td></tr>
          </tbody>
        </table>
      </div>
      <div th:replace="~{fragmentos/rodape :: rodape}"></div>
    </main>
  </div>
</div>
</body>
</html>
