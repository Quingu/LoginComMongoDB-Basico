<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Perfil — ThinDesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
  <link rel="stylesheet" th:href="@{/css/principal.css}">
</head>
<body>
<div th:replace="~{fragmentos/cabecalho :: cabecalho}"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-3 col-lg-2 p-0"><div th:replace="~{fragmentos/menu :: menu}"></div></div>
    <main class="col-md-9 col-lg-10 conteudo">
      <h2>Meu Perfil</h2>
      <div class="cartao" style="max-width:560px">
        <p><strong>E-mail:</strong> <span sec:authentication="name"></span></p>
        <p><strong>Papéis:</strong> <span class="badge bg-secondary" sec:authentication="authorities"></span></p>
        <a th:href="@{/dashboard}" class="btn btn-primario btn-sm">Voltar ao dashboard</a>
      </div>
      <div th:replace="~{fragmentos/rodape :: rodape}"></div>
    </main>
  </div>
</div>
</body>
</html>
