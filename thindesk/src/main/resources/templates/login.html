<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — ThinDesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-fundo">
  <div class="login-cartao text-center">
    <img th:src="@{/images/logo.png}" alt="ThinDesk" class="login-logo">
    <h3 class="mb-1">Bem-vindo</h3>
    <p class="texto-fraco mb-4" style="color:var(--cor-texto-fraco)">Acesse com seu e-mail e senha</p>
    <div th:if="${param.erro}" class="alert alert-danger">E-mail ou senha inválidos.</div>
    <div th:if="${param.logout}" class="alert alert-success">Sessão encerrada com segurança.</div>
    <div th:if="${param.cadastrado}" class="alert alert-success">Conta criada! Faça login.</div>
    <form th:action="@{/login}" method="post" class="text-start">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="mb-3">
        <label for="username" class="form-label">E-mail</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="voce@exemplo.com" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Sua senha" required>
      </div>
      <button type="submit" class="btn btn-primario w-100">Entrar</button>
    </form>
    <div class="mt-3"><a th:href="@{/cadastro}">Criar conta</a></div>
  </div>
</div>
</body>
</html>
