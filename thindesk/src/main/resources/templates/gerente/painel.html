<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área do Gerente — ThinDesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
  <link rel="stylesheet" th:href="@{/css/principal.css}">
  <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body>
<div th:replace="~{fragmentos/cabecalho :: cabecalho}"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-3 col-lg-2 p-0"><div th:replace="~{fragmentos/menu :: menu}"></div></div>
    <main class="col-md-9 col-lg-10 conteudo">
      <h2>Área do Gerente</h2>
      <p style="color:var(--cor-texto-fraco)">Operação da equipe: horários, chamados e clientes.</p>
      <div class="row g-3">
        <div class="col-md-4">
          <div class="cartao painel-cartao">
            <i class="bi bi-alarm painel-icone"></i>
            <h5 class="mt-2">Horários de Atendimento</h5>
            <a th:href="@{/ajustes-horarios}" class="btn btn-primario btn-sm mt-2">Abrir</a>
          </div>
        </div>
        <div class="col-md-4">
          <div class="cartao painel-cartao">
            <i class="bi bi-headset painel-icone"></i>
            <h5 class="mt-2">Chamados</h5>
            <a th:href="@{/chamados}" class="btn btn-primario btn-sm mt-2">Abrir</a>
          </div>
        </div>
        <div class="col-md-4">
          <div class="cartao painel-cartao">
            <i class="bi bi-people painel-icone"></i>
            <h5 class="mt-2">Clientes</h5>
            <a th:href="@{/clientes}" class="btn btn-primario btn-sm mt-2">Abrir</a>
          </div>
        </div>
      </div>
      <div th:replace="~{fragmentos/rodape :: rodape}"></div>
    </main>
  </div>
</div>
</body>
</html>
