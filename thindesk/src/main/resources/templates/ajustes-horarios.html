<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horários — ThinDesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
  <link rel="stylesheet" th:href="@{/css/principal.css}">
</head>
<body>
<div th:replace="~{fragmentos/cabecalho :: cabecalho}"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-3 col-lg-2 p-0"><div th:replace="~{fragmentos/menu :: menu}"></div></div>
    <main class="col-md-9 col-lg-10 conteudo" th:fragment="content">
      <h2>Ajustes de Horários por Setor</h2>
      <div class="cartao mb-3">
        <form th:action="@{/ajustes-horarios/salvar}" method="post">
          <div class="row g-2">
            <div class="col-md-3"><label class="form-label">Setor</label><input type="text" name="setor" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">Dia</label><input type="text" name="diaSemana" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">Início</label><input type="time" name="horarioInicio" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">Fim</label><input type="time" name="horarioFim" class="form-control" required></div>
            <div class="col-md-3 d-flex align-items-end"><button type="submit" class="btn btn-primario">Salvar</button></div>
          </div>
        </form>
      </div>
      <div class="cartao table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Setor</th><th>Dia</th><th>Início</th><th>Fim</th><th></th></tr></thead>
          <tbody>
            <tr th:each="horario : ${horarios}">
              <td th:text="${horario?.setor}"></td>
              <td th:text="${horario?.diaSemana}"></td>
              <td th:text="${horario?.horarioInicio}"></td>
              <td th:text="${horario?.horarioFim}"></td>
              <td><a th:href="@{/ajustes-horarios/deletar/{id}(id=${horario.id})}" class="btn btn-danger btn-sm">Deletar</a></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div th:replace="~{fragmentos/rodape :: rodape}"></div>
    </main>
  </div>
</div>
</body>
</html>
