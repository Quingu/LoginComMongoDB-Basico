<div class="text-center py-4" th:fragment="content" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <h1>Bem-vindo ao ThinDesk</h1>
  <img th:src="@{/images/logo.png}" alt="Logo" width="220" height="220">
  <p style="color:var(--cor-texto-fraco)">Logado como <strong sec:authentication="name">usuário</strong>
    <span class="badge bg-secondary" sec:authentication="authorities"></span></p>
  <div class="d-flex gap-2 justify-content-center flex-wrap">
    <a th:href="@{/dashboard}" class="btn btn-primario">Ir ao dashboard</a>
    <a th:href="@{/chamados}" class="btn btn-outline-secondary">Chamados</a>
  </div>
</div>
