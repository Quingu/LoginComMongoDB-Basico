<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — ThinDesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/temas/{t}.css(t=${@environment.getProperty('app.tema','padrao')})}">
  <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>
<body>
<div class="cadastro-fundo">
  <div class="cadastro-cartao">
    <h3>Criar conta</h3>
    <p class="mb-4" style="color:var(--cor-texto-fraco)">O primeiro acesso entra como USUARIO.</p>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <form th:action="@{/cadastro}" th:object="${cadastro}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input class="form-control" th:field="*{nome}" placeholder="Seu nome">
        <div class="text-danger small" th:errors="*{nome}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input class="form-control" th:field="*{email}" placeholder="voce@exemplo.com">
        <div class="text-danger small" th:errors="*{email}"></div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Senha (mín. 8)</label>
          <input type="password" class="form-control" th:field="*{senha}">
          <div class="text-danger small" th:errors="*{senha}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Confirmar senha</label>
          <input type="password" class="form-control" th:field="*{senhaConfirmacao}">
          <div class="text-danger small" th:errors="*{senhaConfirmacao}"></div>
        </div>
      </div>
      <button class="btn btn-primario w-100" type="submit">Cadastrar</button>
    </form>
    <a th:href="@{/login}" class="d-block mt-3">Já tenho conta</a>
  </div>
</div>
</body>
</html>
