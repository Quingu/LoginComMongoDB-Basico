<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastro — ThinDesk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width:480px">
  <h3>Criar conta</h3>
  <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
  <form th:action="@{/cadastro}" th:object="${cadastro}" method="post">
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input class="form-control" th:field="*{nome}">
      <div class="text-danger" th:errors="*{nome}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <input class="form-control" th:field="*{email}">
      <div class="text-danger" th:errors="*{email}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Senha (mín. 8)</label>
      <input type="password" class="form-control" th:field="*{senha}">
      <div class="text-danger" th:errors="*{senha}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirmar senha</label>
      <input type="password" class="form-control" th:field="*{senhaConfirmacao}">
      <div class="text-danger" th:errors="*{senhaConfirmacao}"></div>
    </div>
    <button class="btn btn-primary w-100" type="submit">Cadastrar</button>
  </form>
  <a th:href="@{/login}" class="d-block mt-3">Já tenho conta</a>
</div>
</body>
</html>
